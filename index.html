<!doctype html>
<html lang="zh-CN" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./assets/fretly.svg" type="image/svg+xml"><title>Fretly · 练琴台</title><link rel="stylesheet" href="./vendor/bootstrap.min.css"><link rel="stylesheet" href="./src/style.css"></head><body>
<header><a class="brand" href="./"><img src="./assets/fretly.svg" alt="" width="38" height="38">Fretly<span>.</span></a><div class="header-controls"><span id="progress"></span><button id="openSongs" class="btn btn-outline-light">曲库</button><button id="openRecords" class="btn btn-outline-light">个人记录</button><button id="fullscreen" class="btn btn-outline-light">全屏 <kbd>F</kbd></button></div></header>
<main><aside><p class="eyebrow">训练计划</p><h1 id="dayTitle">Day 1</h1><p id="dayNote" class="day-note"></p><nav id="lessons" aria-label="课程关卡"></nav><a class="source" href="./assets/scores/red-river-1.png" target="_blank" rel="noopener">女声版原谱 ① ↗</a> <a class="source" href="./assets/scores/red-river-2.png" target="_blank" rel="noopener">② ↗</a></aside>
<section class="studio"><div class="heading"><div><p id="index" class="eyebrow"></p><h2 id="title"></h2></div><div class="clock"><output id="timer">05:00</output><small>剩余练习时间</small></div></div>
<div id="ribbon" class="progress ribbon" role="progressbar" aria-label="本关已练时间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="ribbonFill" class="progress-bar"></div></div><div class="stage"><div id="visual"></div></div><div id="beat"></div>
<div class="transport"><button id="play" class="btn btn-warning">开始跟练 <kbd>Space</kbd></button><button id="restart" class="btn btn-outline-light">重来 <kbd>R</kbd></button><button id="demo" class="btn btn-outline-light" aria-pressed="false">示范声</button><div id="songMode"><button id="loop" class="btn btn-outline-light" aria-pressed="true">循环选段</button><button id="advance" class="btn btn-outline-light" aria-pressed="false">连续播放</button></div></div>
<div id="barsWrap" class="control"><span>小节 · 可多选</span><div id="bars" class="choices" aria-label="小节"></div></div>
<div class="control"><span>速度</span><div id="speeds" class="choices" aria-label="速度档位"></div><label class="custom"><input id="bpm" class="form-control" aria-label="自定义 BPM" type="number" min="30" max="180"> BPM</label></div>
<div id="levelWrap" class="control"><span>练习</span><div id="levels" class="choices" aria-label="练习级别"></div></div>
<div class="control"><span>提示</span><div id="hints" class="choices" aria-label="提示级别"></div></div>
<div class="review"><p id="status" role="status"></p><button id="retry" class="btn btn-outline-light" hidden>再练本关</button><button id="next" class="btn btn-warning" disabled>下一关</button></div></section></main>
<dialog id="songLibrary" class="record-dialog" aria-labelledby="libraryTitle"><div class="record-head"><div><p class="eyebrow">曲目进度</p><h2 id="libraryTitle">曲库</h2></div><form method="dialog"><button class="btn btn-outline-light">关闭</button></form></div><p class="day-note">确认掌握前，关掉示范，从头到尾录一遍。曲目自评可以随时改。</p><div id="songList"></div></dialog>
<dialog id="records" class="record-dialog" aria-labelledby="recordTitle"><div class="record-head"><div><p id="recordLabel" class="eyebrow">练习日历</p><h2 id="recordTitle">个人记录</h2></div><form method="dialog"><button class="btn btn-outline-light">关闭</button></form></div>
<div class="record-stats"><div><small>今日练习</small><strong id="recordToday"></strong></div><div><small>累计时长</small><strong id="recordTotal"></strong></div><div><small>打卡天数</small><strong id="recordDays"></strong></div></div>
<div class="record-goal"><span id="goalText"></span><div id="dailyRibbon" class="progress ribbon" role="progressbar" aria-label="今日打卡进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="dailyFill" class="progress-bar"></div></div></div>
<h3>最近 18 周</h3><div class="calendar-scroll"><div id="calendar" aria-label="每日练习热力图"></div></div><div class="calendar-footer"><span id="dayDetail" aria-live="polite"></span><span class="legend">少 <i data-tone="0"></i><i data-tone="1"></i><i data-tone="2"></i><i data-tone="3"></i><i data-tone="4"></i> 多</span></div>
<h3 id="breakdownTitle">分关时长</h3><ul id="breakdown"></ul></dialog><script type="module" src="./src/app.js"></script></body></html>
